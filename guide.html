<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>動態規範｜Motion Lab</title>
  <meta name="description" content="Motion Lab">
  <!-- 配色：先套用記住的設定（沒有就跟著系統），在畫面出現前完成，避免閃一下 -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono:wght@400&family=Noto+Sans+TC:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/guide.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="nav.skip"></a>

  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html" data-i18n-attr="aria-label:nav.home">
        <span class="logo-mark" aria-hidden="true"></span><span class="logo-text">Motion Lab</span>
      </a>
      <div class="header-end">
        <button class="icon-toggle lang-toggle" type="button" id="langToggle" data-i18n="lang.switch" data-i18n-attr="aria-label:lang.switchLabel;data-tip:lang.switchTip"></button>
        <button class="icon-toggle" type="button" id="themeToggle"><i class="ph-light ph-sun" aria-hidden="true"></i></button>
      </div>
    </div>
  </header>

  <!-- 版面和 Ease 實驗室相同（base.css 的 page-grid）：標題橫跨整頁；電腦版左邊側欄固定，右邊每一節是一個面板 -->
  <main id="main" tabindex="-1" class="page-grid container">
    <div class="page-head" id="top">
      <h1 data-i18n="guide.title"></h1>
      <p class="page-lead" data-i18n="guide.lead"></p>
    </div>

    <!-- ── 左：目錄、依據幾個練習、預覽減少動態的開關 ── -->
    <aside class="side-panel guide-side">
      <nav class="guide-toc" aria-labelledby="toc-title">
        <p class="label" id="toc-title" data-i18n="guide.toc"></p>
        <ol id="guideToc"></ol>
      </nav>
      <div class="guide-meta">
        <span id="guideBasis"></span>
        <!-- 只影響這一頁的示範：示範改成直接切換，讓人看看「減少動態」時是什麼樣子 -->
        <button class="switch" type="button" role="switch" aria-checked="false" id="reduceToggle">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span data-i18n="guide.reduce"></span>
        </button>
      </div>
    </aside>

    <!-- ── 右：各節（js/guide.js 依 js/guide-data.js 產生） ── -->
    <div class="page-main" id="guideBody"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span data-i18n="footer.left"></span>
      <a href="#top" data-to-top data-i18n="footer.right"></a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script type="module" src="js/guide.js"></script>
</body>
</html>
