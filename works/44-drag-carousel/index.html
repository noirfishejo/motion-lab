<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>44 Draggable: Drag Carousel with Inertia</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="head">
      <span class="tag">drag carousel</span>
      <div class="arrows">
        <button type="button" class="icon-btn" id="prev" aria-label="Previous slide"><i class="ph-light ph-arrow-left"></i></button>
        <button type="button" class="icon-btn" id="next" aria-label="Next slide"><i class="ph-light ph-arrow-right"></i></button>
      </div>
    </div>
    <!-- 拖曳整條 track；放開後依照甩動的速度繼續滑（慣性），最後吸附到最近的一張（假資料：藍底＋圖示當作照片） -->
    <div class="viewport" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Featured trails">
      <ul class="track">
        <li class="slide" aria-roledescription="slide" aria-label="1 of 5">
          <div class="img"><i class="ph-light ph-mountains" aria-hidden="true"></i></div>
          <p class="name">Alpine Trail</p>
          <p class="meta">12 km · Hiking</p>
        </li>
        <li class="slide" aria-roledescription="slide" aria-label="2 of 5">
          <div class="img"><i class="ph-light ph-waves" aria-hidden="true"></i></div>
          <p class="name">North Coast</p>
          <p class="meta">8 km · Walk</p>
        </li>
        <li class="slide" aria-roledescription="slide" aria-label="3 of 5">
          <div class="img"><i class="ph-light ph-tree-evergreen" aria-hidden="true"></i></div>
          <p class="name">Pine Valley</p>
          <p class="meta">15 km · Hiking</p>
        </li>
        <li class="slide" aria-roledescription="slide" aria-label="4 of 5">
          <div class="img"><i class="ph-light ph-sun-horizon" aria-hidden="true"></i></div>
          <p class="name">Desert Rim</p>
          <p class="meta">6 km · Sunset</p>
        </li>
        <li class="slide" aria-roledescription="slide" aria-label="5 of 5">
          <div class="img"><i class="ph-light ph-campfire" aria-hidden="true"></i></div>
          <p class="name">Lake Camp</p>
          <p class="meta">2 nights · Camping</p>
        </li>
      </ul>
    </div>
    <div class="dots">
        <button type="button" class="dot" aria-label="Go to slide 1"></button>
        <button type="button" class="dot" aria-label="Go to slide 2"></button>
        <button type="button" class="dot" aria-label="Go to slide 3"></button>
        <button type="button" class="dot" aria-label="Go to slide 4"></button>
        <button type="button" class="dot" aria-label="Go to slide 5"></button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/InertiaPlugin.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
