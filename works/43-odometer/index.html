<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>43 Tween: Rolling Digit Counter</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <span class="tag">rolling digits</span>
    <!-- 營收卡片（假資料）。每一位數字是一條 0–9 的直條，只露出一格；換數字時把直條捲到那一格 -->
    <section class="card">
      <p class="label">Total revenue</p>
      <p class="odo" aria-hidden="true"></p>
      <!-- 讀屏軟體讀這一行（畫面上的直條對讀屏沒有意義） -->
      <p class="sr-only" id="odoText" aria-live="polite"></p>
      <p class="delta up"><i class="ph-light ph-trend-up" aria-hidden="true"></i><span id="delta">+12.4%</span> vs last week</p>
    </section>
    <div class="actions">
      <button type="button" class="btn btn-solid" id="random">Random value</button>
      <button type="button" class="icon-btn" id="minus" aria-label="Minus one"><i class="ph-light ph-minus"></i></button>
      <button type="button" class="icon-btn" id="plus" aria-label="Plus one"><i class="ph-light ph-plus"></i></button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
