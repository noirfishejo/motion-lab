<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <title>21 Timeline: Like Button Burst</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <!-- 一則貼文（假資料）：按愛心、或在圖片上點兩下都會按讚 -->
    <article class="post">
      <div class="photo"><!-- 點兩下按讚只是捷徑；鍵盤和讀屏使用者用下方的愛心按鈕 -->
        <span class="photo-text">Double-click<br>to like</span>
        <!-- 點兩下時中間跳出的大愛心 -->
        <i class="ph-fill ph-heart big-heart" aria-hidden="true"></i>
      </div>
      <footer class="post-bar">
        <button class="like" type="button" aria-pressed="false" aria-label="Like">
          <span class="like-icon">
            <i class="ph-light ph-heart icon-off" aria-hidden="true"></i>
            <i class="ph-fill ph-heart icon-on" aria-hidden="true"></i>
          </span>
          <!-- 粒子和外框由 script.js 放進來 -->
          <span class="burst" aria-hidden="true"></span>
        </button>
        <span class="count"><span class="count-num">128</span> likes</span>
      </footer>
    </article>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
