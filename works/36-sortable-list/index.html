<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>36 Draggable: Sortable List</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="card">
      <h1 class="card-title">Priorities</h1>
      <!-- 可以拖曳排序的清單（假資料）：抓左邊的把手上下拖，其他項目會讓位；鍵盤用上下方向鍵 -->
      <ol class="list">
      <li class="row" data-id="0">
        <button class="handle" type="button" aria-label="Move: Write the brief. Use the up and down arrow keys."><i class="ph-light ph-dots-six-vertical"></i></button>
        <span class="row-text">Write the brief</span>
      </li>
      <li class="row" data-id="1">
        <button class="handle" type="button" aria-label="Move: Collect references. Use the up and down arrow keys."><i class="ph-light ph-dots-six-vertical"></i></button>
        <span class="row-text">Collect references</span>
      </li>
      <li class="row" data-id="2">
        <button class="handle" type="button" aria-label="Move: Sketch three directions. Use the up and down arrow keys."><i class="ph-light ph-dots-six-vertical"></i></button>
        <span class="row-text">Sketch three directions</span>
      </li>
      <li class="row" data-id="3">
        <button class="handle" type="button" aria-label="Move: Pick one and refine. Use the up and down arrow keys."><i class="ph-light ph-dots-six-vertical"></i></button>
        <span class="row-text">Pick one and refine</span>
      </li>
      <li class="row" data-id="4">
        <button class="handle" type="button" aria-label="Move: Prepare the handoff. Use the up and down arrow keys."><i class="ph-light ph-dots-six-vertical"></i></button>
        <span class="row-text">Prepare the handoff</span>
      </li>
      </ol>
      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Draggable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
