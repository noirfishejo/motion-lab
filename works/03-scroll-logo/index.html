<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>03 ScrollTrigger: Square to Header</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&family=Noto+Sans+TC:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 頁首：方塊和文字一開始就放在「終點」 -->
  <header class="bar">
    <span class="logo"><span class="mark"></span><span class="logo-text">Studio</span></span>
    <span class="progress">progress 0%</span>
  </header>

  <!-- 開場：slot 是一個看不見的佔位方塊，只用來標記「起點」的位置 -->
  <section class="hero">
    <div class="lockup">
      <span class="slot"></span>
      <h1 class="title">Studio</h1>
    </div>
    <p class="hint">↓ Scroll down inside the preview</p>
  </section>

  <!-- 下方內容：只是讓頁面夠長可以捲動 -->
  <section class="content">
    <p>The square is now in the header. Scroll up to reverse the animation.</p>
    <p>Turn on the “Markers” switch above the preview to see the ScrollTrigger start / end markers on the right.</p>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
