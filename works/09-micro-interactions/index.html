<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>09 Micro-interactions: Magnetic &amp; Ripple</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <!-- 1. 磁吸按鈕：滑鼠靠近時，按鈕和裡面的文字會被「吸」過去 -->
    <section class="demo">
      <span class="tag">magnetic</span>
      <div class="magnet-zone">
        <button class="btn btn-magnetic" type="button">
          <span class="btn-label">Get started <i class="ph-light ph-arrow-right"></i></span>
        </button>
      </div>
      <p class="hint">Move your cursor near the button</p>
    </section>

    <!-- 2. 波紋按鈕：從點擊的位置擴散出一圈波紋 -->
    <section class="demo">
      <span class="tag">ripple</span>
      <div class="ripple-row">
        <button class="btn btn-ripple" type="button"><span class="btn-label">Primary</span></button>
        <button class="btn btn-ripple btn-ghost" type="button"><span class="btn-label">Secondary</span></button>
      </div>
      <p class="hint">Click anywhere on a button</p>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
