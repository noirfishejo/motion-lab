<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>33 ScrollTrigger: Clip-path Image Reveal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="intro">
      <span class="tag">clip-path reveal</span>
      <h1 class="intro-title">Images open<br>as you scroll.</h1>
      <p class="hint">↓ Scroll inside the preview</p>
    </section>

    <!-- 三張「圖片」（假圖片：藍底＋白色圖示），各用不同方向打開
         data-from：從哪一種縫打開。center = 中間一條橫縫往上下撐開；left = 從左邊往右擦開；bottom = 從底部往上升 -->
    <figure class="shot" data-from="center">
      <div class="shot-img"><i class="ph-light ph-mountains"></i></div>
      <figcaption>01 — Split from the centre</figcaption>
    </figure>
    <figure class="shot is-wide" data-from="left">
      <div class="shot-img"><i class="ph-light ph-waves"></i></div>
      <figcaption>02 — Wipe from the left</figcaption>
    </figure>
    <figure class="shot" data-from="bottom">
      <div class="shot-img"><i class="ph-light ph-tree"></i></div>
      <figcaption>03 — Rise from the bottom</figcaption>
    </figure>

    <section class="outro"><p>Scroll back up — each image closes again.</p></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
