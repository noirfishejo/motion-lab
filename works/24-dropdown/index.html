<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>24 Tween: Dropdown with Sliding Highlight</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="card">
      <span class="tag">dropdown</span>
      <div class="field">
        <span class="field-label" id="sort-label">Sort by</span>
        <!-- 按鈕 + 清單（listbox）：方向鍵移動、Enter 選擇、Esc 關閉 -->
        <div class="dropdown">
          <button class="trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sort-label sort-value">
            <span id="sort-value">Newest</span><i class="ph-light ph-caret-down caret"></i>
          </button>
          <ul class="options" role="listbox" aria-labelledby="sort-label" tabindex="-1" hidden>
            <!-- 跟著滑鼠滑動的高亮底色：整個清單只有一塊 -->
            <li class="highlight" aria-hidden="true"></li>
            <li role="option" aria-selected="true" id="opt-1"><span class="opt-text">Newest</span></li>
            <li role="option" aria-selected="false" id="opt-2"><span class="opt-text">Oldest</span></li>
            <li role="option" aria-selected="false" id="opt-3"><span class="opt-text">Most popular</span></li>
            <li role="option" aria-selected="false" id="opt-4"><span class="opt-text">Name (A–Z)</span></li>
          </ul>
        </div>
      </div>
      <p class="hint">Move the cursor over the options — one highlight follows you.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
