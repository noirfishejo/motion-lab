<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>45 Timeline: Quantity Stepper with Cart Badge</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="bar">
      <span class="tag">quantity stepper</span>
      <!-- 購物車：數量一變，徽章就跳一下、購物袋搖一下 -->
      <button type="button" class="cart icon-btn" aria-label="Cart, 1 item">
        <i class="ph-light ph-shopping-bag"></i>
        <span class="badge" aria-hidden="true">1</span>
      </button>
    </div>

    <!-- 購物車裡的一個品項（假資料） -->
    <article class="item">
      <div class="thumb" aria-hidden="true"><i class="ph-light ph-t-shirt"></i></div>
      <div class="info">
        <p class="name">Linen Shirt</p>
        <p class="price"><span class="total">$48</span><span class="each">$48 each</span></p>
      </div>
      <div class="stepper" role="group" aria-label="Quantity">
        <button type="button" class="step" data-step="-1" aria-label="Decrease quantity"><i class="ph-light ph-minus"></i></button>
        <!-- 數字窗：舊數字滑出去、新數字滑進來 -->
        <span class="qty-window"><span class="qty">1</span></span>
        <button type="button" class="step" data-step="1" aria-label="Increase quantity"><i class="ph-light ph-plus"></i></button>
      </div>
    </article>
    <p class="msg" role="status"></p>
    <!-- 讀屏軟體用：數量改變時唸出來（畫面上看不到） -->
    <p class="sr-only" id="qtyStatus" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
