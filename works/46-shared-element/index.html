<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>46 Flip: Thumbnail Expands into Detail View</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <span class="tag">shared element</span>
    <!-- 點一張卡片：縮圖本身「長大」變成詳細頁的大圖（不是淡入另一張圖），其他內容再依序進場（假資料） -->
    <ul class="grid">
      <li><button type="button" class="card" data-index="0">
        <span class="thumb" data-flip-id="hero-0"><i class="ph-light ph-mountains" aria-hidden="true"></i></span>
        <span class="card-name">Alpine Trail</span>
        <span class="card-meta">Switzerland</span>
      </button></li>
      <li><button type="button" class="card" data-index="1">
        <span class="thumb" data-flip-id="hero-1"><i class="ph-light ph-waves" aria-hidden="true"></i></span>
        <span class="card-name">North Coast</span>
        <span class="card-meta">Portugal</span>
      </button></li>
      <li><button type="button" class="card" data-index="2">
        <span class="thumb" data-flip-id="hero-2"><i class="ph-light ph-tree-evergreen" aria-hidden="true"></i></span>
        <span class="card-name">Pine Valley</span>
        <span class="card-meta">Canada</span>
      </button></li>
      <li><button type="button" class="card" data-index="3">
        <span class="thumb" data-flip-id="hero-3"><i class="ph-light ph-sun-horizon" aria-hidden="true"></i></span>
        <span class="card-name">Desert Rim</span>
        <span class="card-meta">United States</span>
      </button></li>
    </ul>

    <section class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
      <!-- 返回鈕放在最上面、有文字：一看就知道怎麼回到列表（Esc 也可以） -->
      <button type="button" class="btn btn-outline close"><i class="ph-light ph-arrow-left" aria-hidden="true"></i>Back</button>
      <div class="hero"><i class="ph-light" aria-hidden="true"></i></div>
      <div class="detail-text">
        <p class="detail-meta"></p>
        <h2 id="detailTitle"></h2>
        <p class="detail-body"></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
