<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <title>29 Tween: Segmented Control</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="card">
      <span class="tag">segmented control</span>
      <!-- 分段控制：選中的底色是一塊會滑動的方塊；下方長條圖跟著換資料（假資料） -->
      <div class="segmented" role="radiogroup" aria-label="Range">
        <span class="pill" aria-hidden="true"></span>
        <button type="button" role="radio" aria-checked="true" data-range="day">Day</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-range="week">Week</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-range="month">Month</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-range="year">Year</button>
      </div>
      <div class="chart" aria-hidden="true"></div>
      <p class="total" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
