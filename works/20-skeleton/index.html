<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>20 Timeline: Skeleton Loading</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=JetBrains+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- 想再看一次：按作品頁預覽上方的「重播」 -->
    <span class="tag">skeleton</span>

    <!-- 文章列表：載入中先顯示骨架（灰色方塊＋光澤掃過），資料回來後換成真實內容 -->
    <section class="feed" aria-busy="true" aria-live="polite">
      <!-- 卡片由 script.js 產生（假資料） -->
    </section>
  </main>

  <template id="card-template">
    <article class="card">
      <!-- 骨架：形狀和真實內容一樣，換上去時版面才不會跳動 -->
      <div class="skeleton" aria-hidden="true">
        <span class="bone bone-media"><i class="shine"></i></span>
        <span class="bone bone-title"><i class="shine"></i></span>
        <span class="bone bone-title short"><i class="shine"></i></span>
        <span class="bone bone-line first"><i class="shine"></i></span>
        <span class="bone bone-line short"><i class="shine"></i></span>
      </div>
      <!-- 真實內容 -->
      <div class="content" hidden>
        <div class="media"></div>
        <h2 class="title"></h2>
        <p class="text"></p>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
