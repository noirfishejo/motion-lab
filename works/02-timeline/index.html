<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 跟著作品集的亮／暗模式（單獨打開這個檔案時維持深色） -->
  <script>try { document.documentElement.dataset.theme = parent.document.documentElement.dataset.theme || ''; } catch (e) {}</script>
  <!-- 載入完成前先藏起來：GSAP 把元素放到動畫「起點」之前，瀏覽器會先畫出最終畫面，看起來就像閃一下
       等頁面和字體都載入、起點設好之後（再等兩格畫面），才顯示；3 秒後無論如何都顯示 -->
  <script>
    (function () {
      var root = document.documentElement, show = function () { root.classList.remove('is-loading'); };
      root.classList.add('is-loading');
      Promise.all([new Promise(function (r) { addEventListener('load', r); }), document.fonts.ready])
        .then(function () { requestAnimationFrame(function () { requestAnimationFrame(show); }); });
      setTimeout(show, 3000);
    })();
  </script>
  <title>02 Timeline Sequencing</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter+Tight:wght@400;500&family=JetBrains+Mono&family=Noto+Sans+TC:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">

    <!-- 手機畫面大小的 Onboarding 卡片：三個步驟疊在同一個位置 -->
    <section class="device" aria-label="Onboarding example">
      <article class="step" data-step="1">
        <span class="icon"><i class="ph-light ph-hand-waving"></i></span>
        <h2 class="mask"><span>Welcome</span></h2>
        <p>Set things up in three steps. It takes about a minute.</p>
      </article>
      <article class="step" data-step="2">
        <span class="icon"><i class="ph-light ph-sliders-horizontal"></i></span>
        <h2 class="mask"><span>Pick your interests</span></h2>
        <p>Tell us what you like and we will tailor the content.</p>
      </article>
      <article class="step" data-step="3">
        <span class="icon"><i class="ph-light ph-check-circle"></i></span>
        <h2 class="mask"><span>All set</span></h2>
        <p>Start exploring what we picked for you.</p>
      </article>

      <div class="dots" aria-hidden="true">
        <span class="dot"><i></i></span><span class="dot"><i></i></span><span class="dot"><i></i></span>
      </div>
    </section>

    <!-- 時間軸視覺化：藍色播放頭跟著 timeline 的進度走，刻度是 label 的位置 -->
    <div class="ruler" aria-hidden="true">
      <div class="ruler-track"><span class="playhead"></span></div>
      <div class="ruler-labels"></div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
